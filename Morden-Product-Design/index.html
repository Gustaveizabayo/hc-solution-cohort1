<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Product</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    .serif {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>

<body class="bg-gray-100">

  <!-- NAVBAR -->
  <nav class="bg-gray-100">
    <div class="max-w-7xl mx-auto px-8 py-6 flex items-center justify-between">

      <!-- LOGO -->
      <div class="text-2xl font-bold">
        Area
      </div>

      <!-- LINKS -->
      <div class="flex items-center gap-12 text-base font-medium">
        <a href="#" class="hover:text-gray-600">Benefits</a>
        <a href="#" class="hover:text-gray-600">Specifications</a>
        <a href="#" class="hover:text-gray-600">How-to</a>
        <a href="#" class="hover:text-gray-600">Contact Us</a>

        <button class="bg-green-800 text-white px-6 py-3 rounded-full flex items-center gap-2 hover:bg-green-900 transition">
          Learn More
          <img src="image/arrow.png" alt="arrow" class="w-4 h-4" />
        </button>
      </div>

    </div>
  </nav>


  <!-- HERO TEXT -->
  <section class="max-w-7xl mx-auto text-center mt-16 px-8">
    <h1 class="serif text-[110px] md:text-[130px] font-semibold leading-tight">
      Browse everything.
    </h1>
  </section>


  <!-- IMAGE + BACKGROUND SHAPE -->
  <section class="relative max-w-7xl mx-auto mt-20 px-8">

    <!-- green shape behind -->
    <div class="absolute left-0 right-0 mx-auto bottom-6
                w-[90%] md:w-[80%] h-72 md:h-80
                bg-[#8C9A77] rounded-3xl">
    </div>

    <!-- device image -->
    <img src="image/device.png"
         class="relative mx-auto rounded-3xl shadow-2xl w-[85%] md:w-[75%]" alt="device">

  </section>

</body>
</html>
